<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdf7" />
    <title>XmasGoat</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fffdf7; color: #173f2d; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
      main { max-width: 360px; }
      .mark { font-size: 72px; line-height: 1; }
      h1 { margin: 16px 0 8px; font-size: 32px; }
      p { margin: 0; color: #53665c; line-height: 1.5; }
      button { margin-top: 24px; min-height: 48px; border: 0; border-radius: 16px; padding: 0 24px; background: #a51c30; color: white; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🐐</div>
      <h1>Reconnect to XmasGoat</h1>
      <p>Your saved lists are safe. Connect to the internet to open your gifts, wishes and Secret Santa exchanges.</p>
      <button type="button" onclick="location.replace('https://app.xmasgoat.com/')">Try again</button>
    </main>
  </body>
</html>
